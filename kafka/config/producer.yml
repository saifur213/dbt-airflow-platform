# ── Kafka Producer Configuration ─────────────────────────────────────────────
#
# Secrets (passwords) are intentionally NOT stored here.
# They must be provided as environment variables:
#   SOURCE_PG_PASSWORD
#
# All other values here can be overridden by a matching environment variable.

source_postgres:
  host: host.docker.internal   # reaches your local machine from inside Docker
  port: 5432
  database: my_source_db
  user: source_user
  # password → set via env var SOURCE_PG_PASSWORD
  connect_timeout: 10

# One or more tables to stream. Each entry produces to its own Kafka topic.
# To stream multiple tables, add more items to this list.
streams:
  - source_table: public.orders        # schema.table in source Postgres
    watermark_column: updated_at       # must be an indexed timestamp/serial column
    kafka_topic: pg.orders
    batch_size: 500                    # rows fetched per poll cycle
    poll_interval_sec: 10              # seconds to wait between polls

kafka:
  bootstrap_servers: kafka:9092
  producer:
    acks: all
    retries: 5
    retry_backoff_ms: 1000
  topic_defaults:
    num_partitions: 3
    replication_factor: 1

watermark:
  state_dir: /tmp/watermarks          # persisted via Docker volume; one file per stream