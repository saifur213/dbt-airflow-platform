# ── Kafka Consumer Configuration ─────────────────────────────────────────────
#
# Secrets (passwords) are intentionally NOT stored here.
# They must be provided as environment variables:
#   DEST_PG_PASSWORD
#
# All other values here can be overridden by a matching environment variable.

dest_postgres:
  host: host.docker.internal   # reaches your local machine from inside Docker
  port: 5432
  database: my_dest_db
  user: dest_user
  # password → set via env var DEST_PG_PASSWORD
  connect_timeout: 10

# One entry per Kafka topic to consume. Must mirror the streams list in producer.yml.
streams:
  - kafka_topic: pg.orders
    consumer_group: pg-orders-group
    dest_table: raw.orders_streaming   # schema.table in destination Postgres
    commit_batch_size: 100             # rows per Postgres commit
    auto_create_table: true            # create dest table from first message schema (dev)

kafka:
  bootstrap_servers: kafka:9092
  consumer:
    auto_offset_reset: earliest
    enable_auto_commit: false          # manual commit after successful Postgres write
    session_timeout_ms: 30000
    max_poll_interval_ms: 300000