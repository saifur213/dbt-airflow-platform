# ── airflow common config ──────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  image: airflow-dbt:latest
  build:
    context: ../airflow
    dockerfile: Dockerfile
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/logs:/opt/airflow/logs
    - ../airflow/plugins:/opt/airflow/plugins
    - ../dbt:/opt/dbt
  depends_on:
    airflow-postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# ── kafka common config ──────────────────────────────────────────────────────
x-kafka-sink-common: &kafka-sink-common
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    kafka:
      condition: service_healthy
  restart: unless-stopped

services:
  # ── airflow and dbt services ──────────────────────────────────────────────────────
  airflow-postgres:
    image: postgres:15-alpine
    mem_limit: 1g
    ports:
     - "5433:5432"
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 10s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: always

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    mem_limit: 1g
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    mem_limit: 1g
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    mem_limit: 1.5g
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
    - -c
    - |
      airflow db upgrade && \
      airflow users create \
        --username ${AIRFLOW_ADMIN_USERNAME} \
        --firstname ${AIRFLOW_ADMIN_FIRSTNAME} \
        --lastname ${AIRFLOW_ADMIN_LASTNAME} \
        --role Admin \
        --email ${AIRFLOW_ADMIN_EMAIL} \
        --password ${AIRFLOW_ADMIN_PASSWORD} || true
    restart: on-failure

  flower:
    <<: *airflow-common
    command: celery flower
    ports:
      - "5555:5555"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/airflow.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/limit_req.conf:/etc/nginx/conf.d/limit_req.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - airflow-webserver
    restart: always

  dbt-docs:
    <<: *airflow-common
    command: >
      bash -c "
        cd /opt/dbt/analytics &&
        dbt deps &&
        dbt docs generate &&
        python -m http.server 8082 --directory /opt/dbt/analytics/target
      "
    ports:
      - "8082:8082"
    restart: always

  # ── kafka stack ──────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    mem_limit: 512m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
 
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    mem_limit: 1.5g
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # 9092 → inside Docker network (used by producer/consumer/Airflow)
      # 9093 → exposed to host so you can run kafka-console-consumer locally
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
 
      # Two listeners:
      #   INTERNAL → used by containers inside the Docker network
      #   EXTERNAL → used by processes on the host machine
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168        # 7 days
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1 GB per partition
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
 
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    mem_limit: 512m
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
 
  # ── Kafka producer ──────────────────────────────────────────────────────────
  kafka-producer:
    <<: *kafka-sink-common
    build:
      context: ../kafka
      dockerfile: producer/Dockerfile
    container_name: kafka-producer
    mem_limit: 512m
    environment:
      SOURCE_POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
    volumes:
      - kafka-producer-state:/tmp/watermarks
 
  # ── Kafka consumer ────────────────────────────────────────────────────────── 
  kafka-consumer:
    <<: *kafka-sink-common
    build:
      context: ../kafka
      dockerfile: consumer/Dockerfile
    container_name: kafka-consumer
    mem_limit: 512m
    environment:
      TARGET_POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD}

volumes:
  airflow-postgres-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  kafka-producer-state: